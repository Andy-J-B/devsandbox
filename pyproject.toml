[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsandbox"
version = "0.1.0"
description = "DevSandbox: sandboxed coding-agent orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "docker>=7.1.0,<8.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pathspec>=0.12.0,<0.13.0",
    "structlog>=0.39.0,<1.0.0",
    "typer>=0.12.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-testcontainers>=4.8.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["src"]
markers = [
    "docker: integration tests requiring a real Docker daemon (skipped without one)",
    "opencode: integration tests building/running the OpenCode agent image (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/devsandbox/common/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["devsandbox"]

[project.scripts]
devsandbox-api = "devsandbox.api:app"
devsandbox-cli = "devsandbox.cli:app"
