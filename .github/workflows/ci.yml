name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      opencode_live:
        description: "Call a real model (requires the OPENCODE_API_KEY secret)"
        type: boolean
        default: true
      opencode_provider:
        description: "OpenCode provider id (empty: repo variable or 'opencode')"
        type: string
        default: ""
      opencode_model:
        description: "OpenCode model id (empty: repo variable or 'deepseek-v4.1-flash-free')"
        type: string
        default: ""
      opencode_base_url:
        description: "Optional OpenAI-compatible base URL (for local/custom endpoints)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit:
    name: unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        run: mypy
      - name: pytest
        run: pytest -q -m "unit or contract"

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devsandbox
          POSTGRES_PASSWORD: devsandbox
          POSTGRES_DB: devsandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsandbox -d devsandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEVSANDBOX_TEST_DATABASE_URL: postgresql+asyncpg://devsandbox:devsandbox@localhost:5432/devsandbox
      DEVSANDBOX_DATABASE_URL: postgresql+asyncpg://devsandbox:devsandbox@localhost:5432/devsandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: integration
        run: pytest -q -m "integration and not docker"

  docker-e2e:
    name: docker + e2e + security
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devsandbox
          POSTGRES_PASSWORD: devsandbox
          POSTGRES_DB: devsandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsandbox -d devsandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEVSANDBOX_E2E: "1"
      DEVSANDBOX_RUN_VALIDATION_INTEGRATION: "1"
      DEVSANDBOX_TEST_DATABASE_URL: postgresql+asyncpg://devsandbox:devsandbox@localhost:5432/devsandbox
      DEVSANDBOX_DATABASE_URL: postgresql+asyncpg://devsandbox:devsandbox@localhost:5432/devsandbox
      DEVSANDBOX_VALIDATOR_IMAGE: devsandbox/validator:latest
      DEVSANDBOX_SOAK_RUNS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: build validator image
        run: docker build -t devsandbox/validator:latest docker/validator-base
      - name: e2e
        run: pytest -q -m "e2e or security or contract"
      - name: docker-manager integration
        run: pytest -q -m "docker and not e2e and not security and not contract"

  opencode-smoke:
    name: opencode smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEVSANDBOX_RUN_OPENCODE_INTEGRATION: "1"
      DEVSANDBOX_AGENT_IMAGE: devsandbox/agent:test
      DEVSANDBOX_OPENCODE_LIVE: ${{ inputs.opencode_live && '1' || '0' }}
      DEVSANDBOX_OPENCODE_PROVIDER: ${{ inputs.opencode_provider || vars.DEVSANDBOX_OPENCODE_PROVIDER || 'opencode' }}
      DEVSANDBOX_OPENCODE_MODEL: ${{ inputs.opencode_model || vars.DEVSANDBOX_OPENCODE_MODEL || 'deepseek-v4.1-flash-free' }}
      DEVSANDBOX_OPENCODE_BASE_URL: ${{ inputs.opencode_base_url || vars.DEVSANDBOX_OPENCODE_BASE_URL }}
      DEVSANDBOX_OPENCODE_NETWORK: full
      DEVSANDBOX_OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: verify live smoke credentials
        if: ${{ env.DEVSANDBOX_OPENCODE_LIVE == '1' && env.DEVSANDBOX_OPENCODE_BASE_URL == '' }}
        run: |
          if [ -z "${DEVSANDBOX_OPENCODE_API_KEY}" ]; then
            echo "::error::Set the OPENCODE_API_KEY repository secret, or pass a key-less opencode_base_url."
            exit 1
          fi
      - name: build agent image
        run: IMAGE="$DEVSANDBOX_AGENT_IMAGE" docker/agent-base/build.sh
      - name: real OpenCode smoke test
        run: pytest -q -s -m opencode
