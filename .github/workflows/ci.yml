name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        run: mypy
      - name: pytest
        run: pytest -q -m "unit or contract"

  docker-e2e:
    name: docker + e2e + security
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devsandbox
          POSTGRES_PASSWORD: devsandbox
          POSTGRES_DB: devsandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsandbox -d devsandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEVSANDBOX_E2E: "1"
      DEVSANDBOX_RUN_VALIDATION_INTEGRATION: "1"
      DEVSANDBOX_DATABASE_URL: postgresql+asyncpg://devsandbox:devsandbox@localhost:5432/devsandbox
      DEVSANDBOX_VALIDATOR_IMAGE: devsandbox/validator:latest
      DEVSANDBOX_SOAK_RUNS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: build validator image
        run: docker build -t devsandbox/validator:latest docker/validator-base
      - name: e2e
        run: pytest -q -m "e2e or security or contract"
      - name: docker-manager integration
        run: pytest -q -m "docker and not e2e and not security and not contract"

  opencode-smoke:
    name: opencode smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: build agent image
        run: docker build -t devsandbox/agent:latest docker/agent-base
      - name: real OpenCode smoke test
        env:
          DEVSANDBOX_RUN_OPENCODE_INTEGRATION: "1"
        run: pytest -q -m opencode
