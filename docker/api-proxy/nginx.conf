# DevSandbox API TLS reverse proxy (see docs/deployment.md).
#
# This is a complete nginx.conf for the nginxinc/nginx-unprivileged image.
# The proxy listens on 8080 (HTTP -> HTTPS) and 8443 (TLS).  The DevSandbox app
# stays on the private compose network and never terminates TLS itself.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access logs record no request headers.  In particular they must never
    # include $http_authorization or any other credential-bearing header.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    # The unprivileged image can only write below /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 30s;
    server_tokens     off;

    # Edge limiter for unauthenticated floods.  The app's own expensive-endpoint
    # limiter is per process and only runs after authentication, so it does not
    # cover a multi-process deployment or garbage-token traffic.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    upstream devsandbox_api {
        server orchestrator:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # No API content is ever served over plaintext.
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        # The app's own cap is api.max_spec_bytes (default 1 MiB).  Keep a
        # small amount of headroom, but reject obvious abuse at the edge.
        client_max_body_size  2m;
        client_body_timeout   30s;
        client_header_timeout 15s;
        send_timeout          300s;

        # Server-sent events: stream immediately and hold the connection open.
        # The app already sends X-Accel-Buffering: no; keep this explicit so a
        # future app change cannot silently reintroduce buffering.
        location ~ ^/v1/projects/[^/]+/events/stream$ {
            limit_req zone=api_per_ip burst=40 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_buffering   off;
            proxy_cache       off;
            proxy_read_timeout 3600s;

            proxy_pass http://devsandbox_api;
        }

        location / {
            limit_req zone=api_per_ip burst=40 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preserve the bearer token unchanged.  The app is the only
            # authentication boundary; the proxy never interprets or logs it.
            proxy_set_header Authorization     $http_authorization;

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_buffering       on;

            proxy_pass http://devsandbox_api;
        }
    }
}
